    <title>SkillSync Ai Premier | Career Concierge Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cormorant Garamond replaces Playfair Display + EB Garamond for the Donna surface.
         Inter + IBM Plex Mono remain. See docs/DESIGN.md for font role assignments. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* ─── DONNA DARK SURFACE ─────────────────────────────────── */

        /* Canvas & Surface Ladder
           Use surface-2 for elevated/featured cards.
           Card backgrounds using backdrop-filter must be ≥ 0.96 opacity. */
        --donna-canvas:     #07161A;
        --donna-surface-1:  #0A1E24;
        --donna-surface-2:  #0D2329;
        --donna-surface-3:  #112B32;
        --donna-surface-4:  #163238;

        /* Hairlines — use ladder instead of a single value */
        --donna-hairline:         #1A3640;
        --donna-hairline-mid:     #22424A;
        --donna-hairline-strong:  #2D5360;

        /* Accent — exactly 3 uses per viewport:
           1) 2px left border on A2UICards
           2) Active state indicator dot
           3) Accent eyebrow text on active canvas state */
        --donna-accent:       #8DD9BF;
        --donna-accent-dark:  #5FAF95;
        --donna-accent-soft:  rgba(141, 217, 191, 0.14);
        /* Ambient field — DO NOT increase beyond 0.03 */
        --donna-accent-pulse: rgba(45, 197, 194, 0.03);

        /* Text */
        --donna-text-primary:     rgba(220, 231, 232, 0.92);
        --donna-text-secondary:   rgba(142, 163, 167, 0.72);
        --donna-text-ghost:       rgba(142, 163, 167, 0.32);
        --donna-text-placeholder: rgba(142, 163, 167, 0.28);

        /* ─── LIGHT MODE (LoginView / Module Grid) ───────────────── */
        --brand-page:     #f4f1eb;
        --brand-surface:  #fbf8f2;
        --brand-grid:     #d8d0c3;
        --brand-ink:      #28211e;
        --brand-ink-muted: #6b6358;
        --brand-ink-ghost: #a09890;
        --brand-overlay:  #28211e;
        --brand-overlay-text: #f7f1e8;
        /* Teal accent values are shared across light and dark */
        --brand-teal:      #8DD9BF;
        --brand-teal-dark: #5FAF95;
        --brand-teal-soft: rgba(141, 217, 191, 0.14);

        /* ─── TYPOGRAPHY FAMILIES ────────────────────────────────── */
        --font-editorial: 'Cormorant Garamond', Georgia, serif;
        --font-body:      'Inter', system-ui, -apple-system, sans-serif;
        --font-mono:      'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;

        /* ─── TYPE SCALE — DONNA SURFACE ────────────────────────── */
        /* Donna voice (Cormorant italic) */
        --text-donna-size-primary:   28px;
        --text-donna-size-secondary: 22px;
        --text-donna-lh:             1.35;
        --text-donna-ls:             -0.3px;
        /* Card content */
        --text-card-headline-size:   20px;
        --text-card-headline-lh:     1.3;
        --text-card-body-size:       15px;
        --text-card-body-lh:         1.6;
        --text-card-body-ls:         -0.1px;
        --text-card-body-sm-size:    13px;
        /* Data / eyebrow / mono labels */
        --text-eyebrow-size:         9px;
        --text-eyebrow-mid-size:     10px;
        --text-eyebrow-ls:           0.22em;
        --text-eyebrow-mid-ls:       0.24em;
        /* Price labels — always use font-feature-settings: "tnum" */
        --text-price-size:           9px;
        --text-price-ls:             0.22em;

        /* ─── SPACING ────────────────────────────────────────────── */
        --space-card-inner: 20px;
        --space-card-gap:   16px;
        --space-eyebrow-gap: 8px;

        /* ─── MOTION ─────────────────────────────────────────────── */
        --ease-exit:       cubic-bezier(0.22, 1, 0.36, 1);
        --ease-standard:   cubic-bezier(0.65, 0, 0.35, 1);
        --ease-spring:     cubic-bezier(0.175, 0.885, 0.32, 1.275);
        /* Canvas dissolve — always 300ms */
        --dur-dissolve:    300ms;
        /* Message / chip / card entrance stagger */
        --dur-stagger-chip:    80ms;
        --dur-stagger-message: 120ms;
        --dur-stagger-card:    80ms;
        /* Legacy duration names — kept for existing component compatibility */
        --dur-xs:    120ms;
        --dur-sm:    180ms;
        --dur-md:    260ms;
        --dur-lg:    420ms;
        --dur-cinematic: 1100ms;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--brand-page);
        color: var(--brand-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Editorial serif — Cormorant Garamond (replaces Playfair Display + EB Garamond)
         Always italic on the dark surface. Use roman on light surfaces only. */
      .font-editorial {
        font-family: var(--font-editorial);
        font-style: italic;
      }
      .font-editorial-roman {
        font-family: var(--font-editorial);
        font-style: normal;
      }
      .font-body {
        font-family: var(--font-body);
        font-feature-settings: "cv05", "cv11", "dlig";
      }
      /* font-data: monospaced labels, eyebrows, CTAs, price lines */
      .font-data {
        font-family: var(--font-mono);
      }
      /* Tnum variant — use on any element rendering a number or price */
      .font-data-tnum {
        font-family: var(--font-mono);
        font-feature-settings: "tnum";
      }
      /* Legacy aliases — kept for backward compatibility during migration */
      .font-intake-display { font-family: var(--font-editorial); font-style: italic; }
      .font-intake-body    { font-family: var(--font-editorial); font-style: italic; }
      .font-intake-mono    { font-family: var(--font-mono); }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* AGENTIC OS MOTION TOKENS */
      
      /* Easing */
      .ease-exit { transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      .ease-standard { transition-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      .ease-spring-soft { transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); } /* Approx spring */

      /* Durations */
      .dur-xs { transition-duration: 120ms; }
      .dur-sm { transition-duration: 180ms; }
      .dur-md { transition-duration: 260ms; }
      .dur-lg { transition-duration: 420ms; }
      .dur-cinematic { transition-duration: 1100ms; }

      /* Editorial Formatting */
      .drop-cap::first-letter {
        float: left;
        font-family: 'Playfair Display', serif;
        font-size: 3.5rem;
        line-height: 0.8;
        margin-right: 0.75rem;
        margin-top: 0.25rem;
        font-weight: 400;
      }
      
      /* Custom Shadows */
      .shadow-card-hover {
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
      }
      
      /* Intro Animation Sequence Classes */
      .intro-container-transition {
        transition: background-color 2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      
      .intro-card {
        will-change: transform, opacity, box-shadow;
        /* Long, luxurious duration for the 'slide out' */
        transition: 
          transform 1.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.8s ease-out,
          box-shadow 0.5s ease;
      }

      /* State: The Stack (Scene 1-2) */
      /* Cards are translated to center and rotated slightly */
      .intro-stack-state {
        transform: translate(var(--intro-x), var(--intro-y)) rotate(var(--intro-r)) scale(1.05);
        box-shadow: -5px 10px 20px rgba(0,0,0,0.5);
        z-index: 50; /* Force on top */
        pointer-events: none;
        border-color: rgba(255,255,255,0.1);
      }

      /* State: The Grid (Scene 4) */
      /* Cards return to natural flow */
      .intro-grid-state {
        transform: translate(0px, 0px) rotate(0deg) scale(1);
        z-index: 0;
      }

      /* Content Reveal */
      .intro-content-hidden {
        opacity: 0;
        transform: translateY(5px);
      }
      .intro-content-visible {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        transition-delay: 0.4s; /* Wait for grid to lock in */
      }
      
      /* Donna Ambient Keyframes */
      @keyframes donnaBreathe {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%       { opacity: 1;   transform: scale(1.06); }
      }
      @keyframes donnaListen {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50%       { opacity: 1;   transform: scale(1.12); }
      }
      @keyframes donnaThink {
        0%, 100% { opacity: 0.4; }
        50%       { opacity: 1; }
      }

      /* Animation Keyframes */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up {
        animation: fadeUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      
      @keyframes shimmer {
        from { transform: translateX(-150%); }
        to { transform: translateX(150%); }
      }
      .animate-shimmer {
        animation: shimmer 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Sophisticated Loader Animations */
      @keyframes construct {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
        25% { opacity: 0.5; }
        75% { opacity: 0.5; }
        100% { transform: scale(1.1) rotate(45deg); opacity: 0; }
      }
      .animate-construct {
        animation: construct 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Mobile Interaction Pulse */
      @keyframes mobilePulse {
        0% { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); transform: scale(1.025); border-color: transparent; }
        50% { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); transform: scale(1.04); border-color: rgba(0,0,0,0.05); }
        100% { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); transform: scale(1.025); border-color: transparent; }
      }

      .mobile-active-card {
        animation: mobilePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        background-color: white !important;
        z-index: 30 !important;
      }

      .text-brand-teal {
        color: var(--brand-teal-dark);
      }

      .border-brand-teal {
        border-color: var(--brand-teal-dark) !important;
      }

      .hover-border-brand-teal:hover {
        border-color: var(--brand-teal-dark) !important;
      }

      .hover-text-brand-teal:hover {
        color: var(--brand-teal-dark) !important;
      }

      .focus-border-brand-teal:focus {
        border-color: var(--brand-teal-dark) !important;
      }

      .bg-brand-soft {
        background-color: var(--brand-teal-soft);
      }

      .btn-brand {
        background: linear-gradient(135deg, var(--brand-teal), var(--brand-teal-dark));
        color: #05211f;
      }

      .btn-brand:hover {
        filter: brightness(1.04);
      }

      /* Admin Console Typography System — 3 roles */
      .admin-display {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
      }
      .admin-body {
        font-family: 'EB Garamond', Georgia, serif;
      }
      .admin-mono {
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      /* Left-border prompt treatment */
      .admin-prompt-block {
        border-left: 2px solid var(--brand-teal-dark);
        padding-left: 12px;
      }
      /* Stepper inline control */
      .admin-stepper button {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0,0,0,0.12);
        background: white;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .admin-stepper button:hover {
        border-color: var(--brand-teal-dark);
      }
      .admin-stepper input {
        width: 48px;
        text-align: center;
        border: none;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        background: transparent;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        outline: none;
      }
      .admin-stepper input:focus {
        border-color: var(--brand-teal-dark);
      }
      
    </style>
